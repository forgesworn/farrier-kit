name: release

# Hardened npm release via forgesworn/anvil: OIDC trusted publishing (no
# NPM_TOKEN), SLSA provenance, secret scan on the pack set, exports check,
# frozen-vector gate, and a two-runner reproducible-build attestation.
#
# Two triggers land on this one file, which is the OIDC entry-point npm's
# trusted publisher matches against:
#   release: published  - you create the GitHub Release, this publishes it
#   workflow_dispatch    - publish a specific tag by hand
#
# First publish of this new package name is a one-time manual `npm publish`
# (see RELEASING.md); trusted publishing takes over from the next release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.1)
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: forgesworn/anvil/.github/workflows/release.yml@v0
    with:
      tag: ${{ inputs.tag || '' }}
      vector-test-command: npm run test:vectors
      # ci.yml actions are SHA-pinned, so the pin audit runs strict.
      strict-action-pins: true
      # The 1.0.1 run confirmed the tsup build is byte-identical across two
      # independent runners, so a mismatch now blocks the release.
      reproducibility-mode: strict
