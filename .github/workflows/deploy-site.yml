# Deploys the built site to farrier-kit.forgesworn.dev — the shared Hetzner "routing"
# box, same rsync pattern as heartwood's and cambium's deploy-site. Those two
# rsync site/ directly because they are hand-written static files; this one
# builds first and ships docs/, because site/ here is TypeScript source.
#
# The Caddy vhost is installed on the box separately: site/deploy/farrier-kit.Caddyfile
#
# Requires the HETZNER_SSH_KEY repository secret (the deploy@62.238.98.53
# private key, as used by cambium's and heartwood's deploy-site workflows).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Build rather than trust the committed docs/. CI checks the two agree,
      # but CI and this workflow are separate jobs: a push whose docs/ was
      # never rebuilt would fail there and still deploy stale content here.
      - run: npm ci
      - run: npm run build:site

      - name: Deploy to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys for `stall`, the routing host that replaced the retired
          # 95.217.39.110 box after it was cancelled ~2026-08-27. A cancelled address
          # gets reassigned, so the old target was both dead and unsafe to keep
          # pointing an `rsync --delete` at. Never ssh-keyscan per run: TOFU could
          # redirect the rsync, and a failed scan aborts the step under `set -e` with
          # no diagnostic at all, which is how this breakage stayed invisible.
          # If the box is reinstalled, re-scan deliberately and update these.
          cat > ~/.ssh/known_hosts <<'KEYS'
          62.238.98.53 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINr4gdIzT/1x6isUAmLfoap8d6TPF/3OJjVsjtyhnxx9
          62.238.98.53 ssh-rsa 
          62.238.98.53 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNlArhQaGuK2A5GeEZ4NT01oTFMc0Dl8S4Um1lJRWmepniOQDEaBrQduoxofjOc5o6bW7w+8KB92A4OAYQU/C1k=
          KEYS
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            docs/ deploy@62.238.98.53:/opt/farrier-kit/
